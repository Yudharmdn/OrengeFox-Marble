name: Recovery OFOX Build (fox_12.1) — marble

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL Orangefox'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Ctapchuk/android_device_xiaomi_marble-OFRP'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH (repo Ctapchuk/android_device_xiaomi_marble-OFRP.)'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/marble'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH'
        required: false
      COMMON_TREE_BRANCH:
        description: 'COMMON_TREE_BRANCH'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'marble'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_marble'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'
      OF_MAINTAINER:
        description: 'OF_MAINTAINER'
        required: true
        default: 'Yudharn'
      FOX_MAINTAINER_PATCH_VERSION:
        description: 'FOX_MAINTAINER_PATCH_VERSION'
        required: true
        default: '1'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v7

    # Action pihak ketiga di-pin ke SHA (bukan @main/@master) karena job ini punya contents: write
    - name: Free disk space (pre-cleanup)
      uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523
      with:
        preinstalled-runtimes: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b

    - name: Disk space check (setelah cleanup)
      run: |
        echo "== df -h setelah free-disk-space + slimhub =="
        df -h

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo bash setup/android_build_env.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.SYNC_URL, 'git@') ||
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@') }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      id: sync
      env:
        SYNC_URL: ${{ github.event.inputs.SYNC_URL }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone "$SYNC_URL" sync
        cd sync
        SYNC_COMMIT=$(git rev-parse HEAD)
        SYNC_COMMIT_DATE=$(git log -1 --format=%cI)
        SYNC_COMMIT_MSG=$(git log -1 --format=%s)
        echo "sync-commit=$SYNC_COMMIT" >> $GITHUB_OUTPUT
        echo "== Commit repo sync yang dipakai build ini: $SYNC_COMMIT ($SYNC_COMMIT_DATE) =="
        echo "== Pesan commit: $SYNC_COMMIT_MSG =="
        echo "== Riwayat lengkap: https://gitlab.com/OrangeFox/sync/-/commits/master =="
        TARGET=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1

        # Repo sync upstream (commit 53a303ec) kehilangan patch-vendor-twrp-fox_12.1.diff,
        # jadi orangefox_sync.sh gagal patch vendor/twrp. Pakai salinan dari repo ini,
        # tapi hanya kalau upstream belum menyediakan sendiri.
        PATCH_NAME=patch-vendor-twrp-fox_12.1.diff
        PATCH_SRC="$GITHUB_WORKSPACE/patches/$PATCH_NAME"
        if [ ! -f "./$PATCH_NAME" ] && [ -f "$PATCH_SRC" ]; then
          cp "$PATCH_SRC" "./$PATCH_NAME"
          echo "== Patch vendor/twrp dipasok dari repo ini: $PATCH_NAME =="
        else
          echo "== Patch vendor/twrp: pakai punya upstream (atau salinan repo tidak ada) =="
        fi

        success=0
        for attempt in 1 2 3 4 5; do
          echo "== Sync attempt $attempt/5 =="
          ./orangefox_sync.sh --branch 12.1 --path "$TARGET" 2>&1 | tee sync-attempt.log || true
          if [ -f "$TARGET/build/envsetup.sh" ]; then
            success=1
            break
          fi
          echo "Sync attempt $attempt tidak menghasilkan manifest yang valid (build/envsetup.sh tidak ada). Retry in 30s..."
          sleep 30
        done
        if [ "$success" -ne 1 ]; then
          echo "::error::Semua percobaan sync gagal -- $TARGET/build/envsetup.sh tidak pernah ada."
          exit 1
        fi
        # Verifikasi patch vendor/twrp (include orangefox_soong.mk)
        VT="$TARGET/vendor/twrp/config/BoardConfigSoong.mk"
        FOXSOONG="$TARGET/bootable/recovery/orangefox_soong.mk"
        if [ -f "$VT" ]; then
          if grep -q 'bootable/recovery/orangefox_soong.mk' "$VT"; then
            echo "== vendor/twrp: include orangefox_soong.mk sudah terpasang =="
          elif [ -f "$FOXSOONG" ]; then
            echo "== vendor/twrp belum terpatch, coba terapkan manual =="
            if [ -f "$PATCH_SRC" ] && patch -d "$TARGET/vendor/twrp" -p1 < "$PATCH_SRC"; then
              echo "== vendor/twrp: patch manual berhasil =="
            else
              echo "== vendor/twrp: patch manual GAGAL, build lanjut tanpa patch =="
            fi
          else
            echo "== bootable/recovery/orangefox_soong.mk tidak ada di source ini, patch tidak dipasang =="
          fi
          # Kalau include terpasang tapi file-nya tidak ada, build pasti gagal -> cabut barisnya
          if grep -q 'bootable/recovery/orangefox_soong.mk' "$VT" && [ ! -f "$FOXSOONG" ]; then
            sed -i '\#bootable/recovery/orangefox_soong.mk#d' "$VT"
            echo "== include dicabut karena orangefox_soong.mk tidak ada =="
          fi
        else
          echo "== $VT tidak ditemukan, cek patch dilewati =="
        fi

        # Error sync yang tidak fatal dicatat di Job Summary (bukan annotation)
        if grep -q "Failed to patch" sync-attempt.log; then
          {
            echo "### ⚠️ Catatan sync"
            echo "Skrip sync melaporkan patch yang gagal (build tetap lanjut):"
            echo '```'
            grep -E "Error!|No such file" sync-attempt.log | head -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check disk & memory after sync
      if: always()
      run: |
        echo "== Disk =="
        df -h
        echo "== Memory =="
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      env:
        DEVICE_TREE_URL: ${{ github.event.inputs.DEVICE_TREE_URL }}
        DEVICE_TREE_BRANCH: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
        DEVICE_PATH: ${{ github.event.inputs.DEVICE_PATH }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        git clone "$DEVICE_TREE_URL" -b "$DEVICE_TREE_BRANCH" "./$DEVICE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      env:
        COMMON_TREE_URL: ${{ github.event.inputs.COMMON_TREE_URL }}
        COMMON_PATH: ${{ github.event.inputs.COMMON_PATH }}
        COMMON_TREE_BRANCH: ${{ github.event.inputs.COMMON_TREE_BRANCH }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        if [ -n "$COMMON_TREE_BRANCH" ]; then
          git clone "$COMMON_TREE_URL" -b "$COMMON_TREE_BRANCH" "./$COMMON_PATH"
        else
          git clone "$COMMON_TREE_URL" "./$COMMON_PATH"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Workaround known-broken modules unrelated to recovery
      run: |
        TREE=${{ steps.pwd.outputs.workspace-folder }}/fox_12.1

        if [ -d "$TREE/external/se_omapi" ]; then
          rm -rf "$TREE/external/se_omapi"
          mkdir -p "$TREE/external/se_omapi"
          printf 'soong_namespace {\n}\n' > "$TREE/external/se_omapi/Android.bp"
          echo "Distub: $TREE/external/se_omapi"
        else
          echo "external/se_omapi tidak ada di fox_12.1 -- lewati"
        fi

        if [ -d "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client" ]; then
          rm -rf "$TREE/hardware/interfaces/vibrator/aidl/default/example_java_client"
          echo "Dihapus: hardware/interfaces/vibrator/aidl/default/example_java_client"
        fi

        for f in \
          bootable/recovery/openaes/src/oaes_lib.c \
          bootable/recovery/openaes/src/isaac/rand.h \
          bootable/recovery/openaes/src/isaac/rand.c
        do
          F="$TREE/$f"
          if [ -f "$F" ]; then
            if ! grep -q 'Wunknown-warning-option' "$F"; then
              sed -i '1i #pragma clang diagnostic ignored "-Wunknown-warning-option"\n#pragma clang diagnostic ignored "-Wdeprecated-non-prototype"' "$F"
              echo "Patched: $F"
            else
              echo "$F sudah dipatch sebelumnya, lewati"
            fi
          else
            echo "$F tidak ditemukan -- lewati"
          fi
        done

        # ------------------------------------------------------------------
        # FIX annotation: BOARD_PLAT_{PUBLIC,PRIVATE}_SEPOLICY_DIR has been deprecated
        # Versi lama hanya mencari di device/ vendor/ bootable/ dan tidak menemukan apa-apa,
        # padahal variabelnya tetap terdefinisi dari tempat lain.
        # ------------------------------------------------------------------
        cd "$TREE"

        echo "== Diagnosa: file yang menyebut BOARD_PLAT_*_SEPOLICY_DIR (di luar out/.repo/.git) =="
        grep -rnE --include='*.mk' --include='*.sh' --include='*.bp' --include='Makefile' \
          --exclude-dir=.repo --exclude-dir=out --exclude-dir=.git \
          'BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR' . 2>/dev/null | cut -c1-200 | head -40 || true

        # Langkah 1: ganti DEFINISI variabel lama di seluruh tree (semua *.mk),
        # kecuali dua file pengonsumsi yang memang membaca variabel itu.
        files=$(grep -rlE --include='*.mk' \
          --exclude-dir=.repo --exclude-dir=out --exclude-dir=.git \
          '^[[:space:]]*(export[[:space:]]+)?BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR[[:space:]]*[:+?]?=' . 2>/dev/null \
          | grep -vE '/(sepolicy/Android\.mk|soong_config\.mk)$' || true)
        for f in $files; do
          sed -i -E 's/^([[:space:]]*)(export[[:space:]]+)?BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR[[:space:]]*[:+?]?=/\1SYSTEM_EXT_\3_SEPOLICY_DIRS +=/' "$f"
          echo "Patched sepolicy var: $f"
        done
        if [ -z "$files" ]; then echo "Tidak ada definisi BOARD_PLAT_*_SEPOLICY_DIR di *.mk -- lanjut ke langkah 2"; fi

        # Langkah 2 (cadangan): kalau variabel masih terdefinisi dari sumber lain (env, dll),
        # pesan deprecation dari build/make dan system/sepolicy diturunkan dari $(warning) ke $(info).
        # Perilaku build sama: variabel lama tetap diteruskan ke SYSTEM_EXT_*_SEPOLICY_DIRS,
        # hanya tidak lagi jadi annotation kuning di GitHub Actions.
        dep=$(grep -rlE --include='*.mk' \
          'BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR has been deprecated' build system/sepolicy 2>/dev/null || true)
        for f in $dep; do
          sed -i -E 's/\$\(warning[[:space:]]+(BOARD_PLAT_(PUBLIC|PRIVATE)_SEPOLICY_DIR has been deprecated)/$(info \1/' "$f"
          echo "Deprecation message diturunkan ke info: $f"
        done

        # $(warning) informatif bawaan OrangeFox -> $(info): output tetap ada, tidak jadi annotation
        sed -i -E 's/\$\(warning ("FOX_MISCELLANEOUS_ROOT_DIRECTORY" is used)/$(info \1/' bootable/recovery/orangefox.mk 2>/dev/null || true
        sed -i -E 's/\$\(warning (vendor_hw:)/$(info \1/' bootable/recovery/prebuilt/Android.mk 2>/dev/null || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
      with:
        swap-size-gb: 12

    - name: Enable zram swap
      run: |
        sudo apt-get update
        sudo apt-get install -y zram-tools
        echo -e 'ALGO=lz4\nPERCENT=50\nPRIORITY=100' | sudo tee /etc/default/zramswap
        sudo systemctl restart zramswap.service
        echo "== swap layout =="
        swapon --show
        free -h
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Disk space check (sebelum build)
      run: |
        echo "== df -h =="
        df -h
        echo "== 20 folder terbesar di source tree =="
        du -sh ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/* 2>/dev/null | sort -rh | head -20
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      env:
        MAKEFILE_NAME: ${{ github.event.inputs.MAKEFILE_NAME }}
        BUILD_TARGET: ${{ github.event.inputs.BUILD_TARGET }}
        OF_MAINTAINER_IN: ${{ github.event.inputs.OF_MAINTAINER }}
        PATCH_VERSION_IN: ${{ github.event.inputs.FOX_MAINTAINER_PATCH_VERSION }}
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL="C"
        export OF_MAINTAINER="$OF_MAINTAINER_IN"
        export FOX_MAINTAINER_PATCH_VERSION="$PATCH_VERSION_IN"
        export OF_SCREEN_H=2400

        PRODUCT="$MAKEFILE_NAME"
        VARIANT="eng"

        echo "== lunch ${PRODUCT}-${VARIANT} =="
        if ! lunch "${PRODUCT}-${VARIANT}"; then
          echo "::error::lunch ${PRODUCT}-${VARIANT} gagal. fox_12.1 seharusnya memakai format lunch lama 2-bagian -- cek apakah MAKEFILE_NAME benar terdaftar di AndroidProducts.mk tree ini, atau apakah manifest yang ter-sync ternyata bukan benar-benar fox_12.1."
          exit 1
        fi

        set -e
        set -o pipefail
        ( make clean && mka adbd ${BUILD_TARGET}image -j$(nproc --all) ) 2>&1 | tee ${{ steps.pwd.outputs.workspace-folder }}/build.log
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload build log (jika build gagal)
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-log-${{ github.run_id }}
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
        retention-days: 7

    # Release hanya berisi file ZIP installer OrangeFox, jadi cukup verifikasi ZIP-nya.
    - name: Verify build artifacts
      id: verify
      env:
        DEVICE_NAME: ${{ github.event.inputs.DEVICE_NAME }}
      run: |
        BUILD_LOG="${{ steps.pwd.outputs.workspace-folder }}/build.log"
        PRODUCT_OUT="${{ steps.pwd.outputs.workspace-folder }}/fox_12.1/out/target/product/${DEVICE_NAME}"

        ZIP_PATH=$(grep -m1 '^Recovery zip:' "$BUILD_LOG" | sed 's/^Recovery zip:[[:space:]]*//')

        if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
          ZIP_PATH=$(find "$PRODUCT_OUT" -type f -iname 'OrangeFox-*.zip' 2>/dev/null | head -n1)
        fi

        echo "zip: ${ZIP_PATH:-<tidak ditemukan>}"

        if [ -z "$ZIP_PATH" ] || [ ! -f "$ZIP_PATH" ]; then
          echo "::error::Tidak bisa menemukan file .zip OrangeFox yang valid (lewat build.log maupun pencarian rekursif di $PRODUCT_OUT)."
          echo "== Struktur $PRODUCT_OUT sampai 3 level (untuk debug) =="
          find "$PRODUCT_OUT" -maxdepth 3 2>/dev/null
          exit 1
        fi

        echo "zip-path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ steps.verify.outputs.zip-path }}
        name: ${{ github.event.inputs.DEVICE_NAME }}-fox12-${{ github.run_number }}
        tag_name: ${{ github.event.inputs.DEVICE_NAME }}-fox12-${{ github.run_number }}
        fail_on_unmatched_files: true
        body: |
          | | |
          |---|---|
          | 📱 **Device** | POCO F5 / Redmi Note 12 Turbo (`${{ github.event.inputs.DEVICE_NAME }}`) |
          | 🦊 **Recovery** | OrangeFox Recovery Project |
          | 🌿 **Manifest** | fox_12.1 (STABLE) |
          | 📦 **File** | ZIP installer OrangeFox (flash lewat recovery) |
          | 📦 **Device Tree** | ${{ github.event.inputs.DEVICE_TREE_URL }} |
          | 🌿 **Tree Branch** | `${{ github.event.inputs.DEVICE_TREE_BRANCH }}` |
          | 🛠️ **Toolchain** | OpenJDK 11 (Zulu) |
          | 🔗 **Sync Commit** | [`${{ steps.sync.outputs.sync-commit }}`](https://gitlab.com/OrangeFox/sync/-/commit/${{ steps.sync.outputs.sync-commit }}) |
          | 👤 **Maintainer** | ${{ github.event.inputs.OF_MAINTAINER }} (patch ${{ github.event.inputs.FOX_MAINTAINER_PATCH_VERSION }}) |

          ---
          ### ✨ OrangeFox Recovery — marble ✨
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
